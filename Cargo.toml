[workspace]
members = [
    "crates/ltbox-core",
    "crates/ltbox-device",
    "crates/ltbox-patch",
    "crates/front2",
    "crates/tillkit",
]
# Vendored third-party crate — built as a path dependency, not a member,
# so it keeps its own edition/lints and doesn't inherit workspace config.
exclude = ["vendor/qdl"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Error handling
thiserror = "2"
anyhow = "1"
# fs-err: drop-in wrapper around std::fs that embeds the path in
# io::Error Display, so `.map_err(|e| format!("X {path}: {e}"))`
# boilerplate collapses to a plain `?`.
fs-err = "3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto — RustCrypto 2026 bundle.
sha1 = "0.11"
sha2 = "0.11"
digest = "0.11"
getrandom = "0.4"

# HTTP — ureq 3, pure-blocking rustls client. One-shot + small call
# sites (GitHub JSON, nightly.link zip, Qualcomm driver zip).
ureq = { version = "3", features = ["json"] }

# Zip (Qualcomm driver archive extraction)
zip = { version = "9", default-features = false, features = ["deflate"] }
# Release self-update archives use gzip-compressed tarballs on Linux/macOS.
flate2 = "1"
# Strict base64 decoding (KonaBess export URIs).
base64 = "0.22"
# LZMA-alone decoding for compressed ABL LinuxLoader images. This is already
# present transitively through kptools/magiskboot.
lzma-rust2 = "0.16.5"

# XML
roxmltree = "0.21"

# In-memory TTL cache for GitHub API responses. A single root-provisioning
# run builds up to seven `GitHubClient`s (one per root solution) — without
# a cache the same `/releases/latest` endpoint is hit twice per run for
# every client that resolves an asset on the latest tag. moka keys on
# (owner_repo, endpoint) with a 5-minute TTL so the pipeline converges
# to one request per endpoint per run without coordinating the clients.
moka = { version = "0.12", features = ["sync"] }

# Logging — tracing for structured `info!` macros.
tracing = "0.1"

# ADB
adb_client = { version = "3", features = ["usb"] }
# Pulled transitively by `adb_client`; declared directly so the RSA
# key persistence helper in `ltbox-device::adb` can call
# `to_pkcs8_pem` to write the LTBox-owned `adbkey` to disk on first
# launch (avoids re-triggering the on-device "Allow USB debugging?"
# prompt every run).
rsa = "0.9"

# USB (for Fastboot).
nusb = "0.2"
pollster = "1"
# Serial (for kernel-driver EDL backend discovery).
serialport = "4"

# GUI
iced = { version = "0.14", features = ["tokio", "svg", "image", "advanced", "canvas"] }
rfd = "0.17"
dirs = "7"
dark-light = "3"
semver = "1"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_Threading"] }
tokio = { version = "1", features = ["rt"] }
gptman = "3"

# External tool crates (git dependencies)
avbtool-rs = { git = "https://github.com/miner7222/avbtool-rs", tag = "v0.2.0" }
magiskboot = { git = "https://github.com/miner7222/magiskboot-rs", tag = "v0.1.2" }
kptools = { git = "https://github.com/miner7222/kptools-rs", tag = "v0.2.1+kp0.13.9" }
# Vendored under vendor/qdl — qualcomm/qdlrs + some local fixes.
# See vendor/qdl/VENDORING.md.
qdl = { path = "vendor/qdl", features = ["serial", "usb"] }

# Release tuning for the shipped GUI binary. `panic` is left at the default
# "unwind" on purpose: worker threads rely on unwinding so a single failed
# operation aborts that task instead of taking down the whole app.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
